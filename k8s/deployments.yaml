apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-nginx
  template:
    metadata:
      labels:
        app: ci-nginx
    spec:
      containers:
        - name: ci-nginx
          image: moisawade/ci-nginx:dev
          ports:
            - containerPort: 80